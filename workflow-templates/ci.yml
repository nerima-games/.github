# Wave 0 (2026-08-30): this is the shape common to all 15 runtime repos
# (mc-kernel excepted). It is modeled on mc-kernel's own ci.yaml but is NOT a
# byte-for-byte copy; differences from kernel's current file, all
# intentional: `permissions.packages: read` and the "Configure GitHub
# Packages authentication" step (needed because these 15 repos install
# @nerima-games/* siblings from GitHub Packages and kernel does not -- kernel
# has zero @nerima-games/* dependencies, PACKAGE_STANDARD.md "4層の依存
# アーキテクチャ"), `fetch-depth: 0` on checkout and the "Changeset status"
# step (both needed once changesets is adopted -- kernel does not use
# changesets yet), and "Coverage" as its own step calling
# `pnpm test:coverage` (kernel's `pnpm verify` currently bundles coverage
# into itself; TEST_STANDARD.md §1 says verify and coverage should be
# separate, and kernel has not yet been moved to that split).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Verify
        run: nix develop --command pnpm verify

      - name: Changeset status
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '^(docs/|\.github/)'; then
            nix develop --command pnpm exec changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "Only docs/ or .github/ changed; skipping changeset check."
          fi

      - name: Coverage
        run: nix develop --command pnpm test:coverage

      # mc-compose does not have this step (no dist/ to verify -- its
      # distributable is the `vite build` web bundle, PACKAGE_STANDARD.md
      # "package.json の必須フィールドとスクリプト"). This template file
      # itself defines only the single `ci:` job above; mx-ui and mc-compose
      # each add a SECOND, separate job (not present here -- add it when you
      # copy this template into those two repos) that runs their browser
      # suite (`pnpm e2e:browser` / Playwright), timeout-minutes: 30, with
      # `npx playwright install --with-deps chromium` first. That job is not
      # a required merge gate (TEST_STANDARD.md §2.2: CI has no browser
      # binaries by default, so a missing-binary failure should not read as a
      # code defect).
      - name: Verify package boundary
        run: nix develop --command pnpm package:verify

      - name: Audit dependencies
        run: nix develop --command pnpm audit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
