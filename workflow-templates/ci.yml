name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # SHA resolved 2026-08-01 via `gh api repos/actions/checkout/git/ref/tags/v6.1.0`.
        # Re-resolve yourself before bumping; do not copy this value blindly
        # once it is stale.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not a mutable tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        # SHA resolved 2026-08-01 via `gh api repos/actions/setup-node/git/ref/tags/v6.5.0`.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a
      # package.json devDependency (PACKAGE_STANDARD.md) -- a single
      # Nix-pinned version replaces 16 repos each independently drifting on
      # their own npm-resolved oxlint version. Copy templates/actions/nix-setup
      # to <repo>/.github/actions/nix-setup/ verbatim; do not inline these
      # steps here.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # oxlint's no-restricted-imports (.oxlintrc.json) is the enforcement
      # mechanism for the Tier dependency policy (DEPENDENCY_POLICY.md §5).
      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      # Coverage measurement always runs; whether it actually gates the build
      # depends on the thresholds configured in vitest.config.ts (see
      # TEST_STANDARD.md). Keep the numbers in that config, not here, so
      # `pnpm test:coverage` gates identically on a laptop and in CI.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        # SHA resolved 2026-08-01 via `gh api repos/actions/upload-artifact/git/ref/tags/v6.0.0`.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: coverage/
          retention-days: 7
