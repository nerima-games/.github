name: Release

on:
  push:
    branches: [$default-branch]

# changesets/action needs to push the "Version Packages" branch/commit, open
# or update the PR for it, and -- once that PR is merged -- publish to
# GitHub Packages. This workflow only ever runs on a push to the default
# branch (never on a fork pull_request), so granting write here does not
# hand a writable token to untrusted code. See RELEASE_STANDARD.md §3.2.
permissions:
  contents: write # push the Version Packages branch / release commit
  pull-requests: write # open/update the Version Packages PR
  packages: write # `pnpm publish` to npm.pkg.github.com

# One release flow per branch at a time; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # SHA resolved 2026-08-01 via `gh api repos/actions/checkout/git/ref/tags/v6.1.0`.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # changesets needs full history to diff .changeset/*.md against the
          # base branch; a shallow clone would make `changeset version` (run
          # by changesets/action below) treat every changeset as unresolved.
          fetch-depth: 0

      - name: Setup pnpm
        # Same pin as workflow-templates/ci.yml -- keep the two in sync.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        # SHA resolved 2026-08-01 via `gh api repos/actions/setup-node/git/ref/tags/v6.5.0`.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "pnpm"
          # Required so `pnpm publish` resolves to GitHub Packages using
          # NODE_AUTH_TOKEN below, per RELEASE_STANDARD.md §3.2.
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # changesets/action does one of two things, depending on repository
      # state (RELEASE_STANDARD.md §1.3, §3.1):
      #   - if there are unconsumed .changeset/*.md files on main, it opens or
      #     updates a "Version Packages" PR that runs the `version` command
      #     below (bumps package.json#version, appends to CHANGELOG.md);
      #   - once that PR is merged (no pending changesets, version already
      #     bumped on this push), it runs the `publish` command instead,
      #     which is what actually calls `pnpm publish` against GitHub
      #     Packages.
      # A single job/step handles both branches because changesets/action
      # itself decides which one applies; RELEASE_STANDARD.md §3.1 recommends
      # this over hand-rolling a `git diff -- package.json` version-bump
      # check.
      #
      # This workflow does not re-run typecheck/lint/test itself before
      # publishing (RELEASE_STANDARD.md §3.3 leaves that choice to each
      # repository). As shipped, it relies on branch protection already
      # having required workflow-templates/ci.yml to pass before anything
      # reaches main. If this repository's branch protection does not
      # enforce that, add an explicit verify step before this one.
      - name: Create Release Pull Request or Publish to GitHub Packages
        # SHA resolved 2026-08-01 via
        # `gh api repos/changesets/action/git/ref/tags/v1.9.0` (annotated tag,
        # unwrapped one level to the commit).
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm publish --no-git-checks
        env:
          # Used by changesets/action itself to push the Version Packages
          # branch and open/update its PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used by `pnpm publish` to authenticate against
          # npm.pkg.github.com. GitHub Packages accepts the workflow's own
          # GITHUB_TOKEN once the job has `packages: write` above
          # (RELEASE_STANDARD.md §3.2) -- no separate NPM_TOKEN or PAT secret
          # exists or is needed for this registry.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
