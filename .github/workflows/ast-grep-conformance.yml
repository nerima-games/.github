name: ast-grep conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./templates/actions/nix-setup

      - name: Test shared rule fixtures
        run: nix shell github:NixOS/nixpkgs/624af665418d3c65d544145b4d34ad696439570e#ast-grep --command ast-grep test --config conformance/ast-grep/sgconfig.yml

      - name: Test consuming repository path fixtures
        run: nix shell github:NixOS/nixpkgs/624af665418d3c65d544145b4d34ad696439570e#ast-grep github:NixOS/nixpkgs/624af665418d3c65d544145b4d34ad696439570e#jq --command bash conformance/ast-grep/test-path-fixtures.sh

      - name: Test public-api baseline fixtures
        run: nix shell github:NixOS/nixpkgs/624af665418d3c65d544145b4d34ad696439570e#ast-grep github:NixOS/nixpkgs/624af665418d3c65d544145b4d34ad696439570e#jq --command bash conformance/ast-grep/test-baseline-fixtures.sh
