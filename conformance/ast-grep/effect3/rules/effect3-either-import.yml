id: effect3-either-import
language: TypeScript
severity: error
message: "Do not import the deprecated Effect 3 Either module."
rule:
  kind: import_statement
  any:
    - has:
        field: source
        regex: ^["']effect/Either(?:\.js)?["']$
    - all:
        - has:
            field: source
            regex: ^["']effect["']$
        - has:
            kind: import_specifier
            stopBy: end
            has:
              field: name
              pattern: Either
