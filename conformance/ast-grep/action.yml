name: Check org ast-grep conformance
description: Test and scan the repository with the nerima-games shared ast-grep rules.

inputs:
  public-api-baseline:
    description: Consumer-repository-relative path to the public-api baseline JSON file.
    required: false

runs:
  using: composite
  steps:
    - name: Test shared rules and scan the repository
      shell: bash
      env:
        PUBLIC_API_BASELINE: ${{ inputs.public-api-baseline }}
      run: |
        nix shell github:NixOS/nixpkgs/624af665418d3c65d544145b4d34ad696439570e#jq \
          --command bash "$GITHUB_ACTION_PATH/run-consumer.sh"
