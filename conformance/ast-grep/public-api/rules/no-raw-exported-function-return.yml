id: no-raw-exported-function-return
language: TypeScript
severity: error
message: Use a branded type for exported function return values instead of raw number or string.
note: >-
  Only direct export declarations and function expressions or arrows assigned
  to exported variables are matched. Re-exports are not resolved; function
  bodies and local helpers are outside the signature. Only literal `number`
  and `string` annotations are matched; replacement types are not checked for
  a brand.
files:
  - '**/src/**/*.ts'
  - '**/src/**/*.mts'
  - '**/src/**/*.cts'
utils:
  exported-function:
    any:
      - all:
          - kind: function_declaration
          - inside:
              kind: export_statement
              field: declaration
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
      - all:
          - kind: function_expression
          - inside:
              kind: export_statement
              field: declaration
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
      - all:
          - kind: arrow_function
          - inside:
              kind: export_statement
              field: declaration
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
rule:
  all:
    - kind: predefined_type
    - regex: '^(number|string)$'
    - inside:
        matches: exported-function
        field: return_type
        stopBy:
          any:
            - kind: function_declaration
            - kind: function_expression
            - kind: arrow_function
