id: no-promise-in-src-tsx
language: Tsx
severity: error
files:
  - src/**/*.tsx
message: Do not use Promise types or construct Promises in shipping source.
rule:
  any:
    - all:
        - kind: generic_type
        - has:
            kind: type_identifier
            regex: '^Promise$'
    - pattern: new Promise($$$ARGS)
    - pattern: new Promise<$TYPE>($$$ARGS)
