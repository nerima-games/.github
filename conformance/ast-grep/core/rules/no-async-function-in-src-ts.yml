id: no-async-function-in-src-ts
language: TypeScript
severity: error
files:
  - src/**/*.ts
  - src/**/*.mts
  - src/**/*.cts
message: Do not declare async functions in shipping source.
rule:
  any:
    - all:
        - kind: function_declaration
        - regex: '^\s*async\b'
    - all:
        - kind: function_expression
        - regex: '^\s*async\b'
    - all:
        - kind: arrow_function
        - regex: '^\s*async\b'
    - all:
        - kind: method_definition
        - regex: '^\s*async\b'
